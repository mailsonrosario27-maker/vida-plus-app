# Blueprint do Render — permite criar o serviço com um clique em
# render.com/deploy (ou "New > Blueprint" apontando para este repositório).
# As variáveis marcadas com "sync: false" são segredos: o Render pede o
# valor uma vez na criação e nunca fica registrado neste arquivo.
services:
  - type: web
    name: vida-plus-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
